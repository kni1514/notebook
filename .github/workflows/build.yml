name: Build Notebook

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
name: Build ${{ matrix.os_name }}
runs-on: ${{ matrix.os }}

```
strategy:
  fail-fast: false
  matrix:
    include:
      - os: windows-latest
        os_name: Windows
        artifact: notebook-windows

      - os: ubuntu-latest
        os_name: Linux
        artifact: notebook-linux

      - os: macos-latest
        os_name: macOS
        artifact: notebook-macos

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build application
    run: |
      pyinstaller --clean --noconfirm notebook.spec

  - name: Rename Windows executable
    if: runner.os == 'Windows'
    shell: bash
    run: |
      mkdir -p release
      cp dist/notebook.exe release/notebook.exe

  - name: Rename Linux executable
    if: runner.os == 'Linux'
    shell: bash
    run: |
      mkdir -p release
      cp dist/notebook release/notebook

  - name: Rename macOS executable
    if: runner.os == 'macOS'
    shell: bash
    run: |
      mkdir -p release
      cp dist/notebook release/notebook

  - name: Upload Windows binary
    if: runner.os == 'Windows'
    uses: actions/upload-artifact@v4
    with:
      name: notebook-windows
      path: release/notebook.exe

  - name: Upload Linux binary
    if: runner.os == 'Linux'
    uses: actions/upload-artifact@v4
    with:
      name: notebook-linux
      path: release/notebook

  - name: Upload macOS binary
    if: runner.os == 'macOS'
    uses: actions/upload-artifact@v4
    with:
      name: notebook-macos
      path: release/notebook
```
