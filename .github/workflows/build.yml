name: Build Notebook

on:
push:
branches:
- main
workflow_dispatch:

jobs:

windows:
name: Windows Build
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build application
    run: pyinstaller --clean --noconfirm notebook.spec

  - name: Upload Windows
    uses: actions/upload-artifact@v4
    with:
      name: notebook-windows
      path: dist/notebook.exe
```

linux:
name: Linux Build
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Linux dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

  - name: Install Python dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build application
    run: pyinstaller --clean --noconfirm notebook.spec

  - name: Upload Linux
    uses: actions/upload-artifact@v4
    with:
      name: notebook-linux
      path: dist/notebook
```

