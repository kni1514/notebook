name: Build Notebook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: notebook-linux
            output: notebook

          - os: macos-latest
            artifact: notebook-macos
            output: notebook

          - os: windows-latest
            artifact: notebook-windows
            output: notebook.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0 \
            libxcb-image0 \
            libxcb-randr0 \
            libxcb-xtest0 \
            libxcb-xinerama0 \
            libdbus-1-3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Python Executable (with debug output)
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: $RUNNER_OS"
          echo "Matrix: os=${{ matrix.os }}, artifact=${{ matrix.artifact }}, output=${{ matrix.output }}"
          echo "Workspace contents:"
          ls -la .

          # Ensure spec exists
          if [ ! -f notebook.spec ]; then
            echo "ERROR: notebook.spec not found in repository root."
            echo "Listing repo files:"
            git ls-files
            exit 1
          fi

          # Run pyinstaller and capture output
          pyinstaller --noconfirm notebook.spec || {
            echo "PyInstaller failed. Showing dist/ and build/ for diagnosis:"
            ls -R dist || true
            ls -R build || true
            exit 1
          }

          echo "PyInstaller finished. Dist directory:"
          ls -R dist || true

          # Try to find the built executable inside dist/.
          FILE=$(find dist -type f -name "${{ matrix.output }}" -print -quit || true)

          # If not found, pick the first executable file under dist/ (useful when PyInstaller creates a single file or variant names).
          if [ -z "$FILE" ]; then
            FILE=$(find dist -type f -executable -print -quit || true)
          fi

          # If still not found, try top-level files in a one-folder bundle (e.g., dist/Notebook/Notebook)
          if [ -z "$FILE" ]; then
            FIRST_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit || true)
            if [ -n "$FIRST_DIR" ]; then
              FILE=$(find "$FIRST_DIR" -type f -executable -print -quit || true)
            fi
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: No executable found in dist/"
            ls -R dist || true
            exit 1
          fi

          echo "Found build artifact: $FILE"
          cp "$FILE" "${{ matrix.output }}"
          echo "Copied to ${ { matrix.output } }" || true

      - name: Upload primary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}

      - name: Upload dist folder for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: notebook-linux
          path: bin

      - name: Rename Linux
        run: mv bin/notebook bin/notebook-linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: notebook-macos
          path: bin

      - name: Rename macOS
        run: mv bin/notebook bin/notebook-macos

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: notebook-windows
          path: bin

      - name: Rename Windows
        run: mv bin/notebook.exe bin/notebook-windows.exe

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bin

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update compiled binaries"
          git push
