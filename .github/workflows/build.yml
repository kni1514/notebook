name: Build Notebook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: notebook-linux
            output: notebook

          - os: macos-latest
            artifact: notebook-macos
            output: notebook

          - os: windows-latest
            artifact: notebook-windows
            output: notebook.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0 \
            libxcb-image0 \
            libxcb-randr0 \
            libxcb-xtest0 \
            libxcb-xinerama0 \
            libdbus-1-3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Executable
        shell: bash
        run: |
          pyinstaller --noconfirm notebook.spec
          cp "dist/${{ matrix.output }}" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: notebook-linux
          path: bin

      - name: Rename Linux
        run: mv bin/notebook bin/notebook-linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: notebook-macos
          path: bin

      - name: Rename macOS
        run: mv bin/notebook bin/notebook-macos

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: notebook-windows
          path: bin

      - name: Rename Windows
        run: mv bin/notebook.exe bin/notebook-windows.exe

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bin

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update compiled binaries"
          git push
