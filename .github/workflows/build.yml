name: Build Notebook

on:
push:
branches:
- main
workflow_dispatch:

jobs:
windows:
name: Windows Build
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build
    run: |
      pyinstaller --clean --noconfirm notebook.spec

  - name: Upload Windows executable
    uses: actions/upload-artifact@v4
    with:
      name: notebook-windows
      path: dist/notebook.exe
      if-no-files-found: error
```

linux:
name: Linux Build
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Linux libraries
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        libegl1 \
        libgl1 \
        libglx-mesa0 \
        libxcb-cursor0 \
        libxcb-icccm4 \
        libxcb-keysyms1 \
        libxcb-render-util0 \
        libxcb-shape0 \
        libxcb-xfixes0 \
        libxkbcommon-x11-0 \
        libxcb-image0 \
        libxcb-randr0 \
        libxcb-xtest0 \
        libxcb-xinerama0 \
        libdbus-1-3

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller

  - name: Build
    run: |
      pyinstaller --clean --noconfirm notebook.spec

  - name: Make executable
    run: |
      chmod +x dist/notebook

  - name: Upload Linux executable
    uses: actions/upload-artifact@v4
    with:
      name: notebook-linux
      path: dist/notebook
      if-no-files-found: error
```

