name: Notebook Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
windows:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- run: python -m pip install --upgrade pip
- run: pip install -r requirements.txt
- run: pip install pyinstaller
- run: pyinstaller --clean --noconfirm notebook.spec
- uses: actions/upload-artifact@v4
with:
name: notebook-windows
path: dist/

linux:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- run: sudo apt-get update
- run: sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
- run: python -m pip install --upgrade pip
- run: pip install -r requirements.txt
- run: pip install pyinstaller
- run: pyinstaller --clean --noconfirm notebook.spec
- uses: actions/upload-artifact@v4
with:
name: notebook-linux
path: dist/

macos:
runs-on: macos-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- run: python -m pip install --upgrade pip
- run: pip install -r requirements.txt
- run: pip install pyinstaller
- run: pyinstaller --clean --noconfirm notebook.spec
- uses: actions/upload-artifact@v4
with:
name: notebook-macos
path: dist/
